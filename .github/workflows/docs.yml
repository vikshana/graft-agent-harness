name: docs

on:
  pull_request:
    paths: ['docs/**', 'deployment/**', 'scripts/**', 'AGENTS.md', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'deployment/**', 'scripts/**', 'AGENTS.md', '.github/workflows/docs.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Documentation hygiene
        run: python3 scripts/check_docs.py

      - name: Decision index is up to date
        run: |
          python3 scripts/gen_adr_index.py
          git diff --exit-code docs/adr/DECISION-INDEX.md \
            || { echo "::error::DECISION-INDEX.md is stale. Run scripts/gen_adr_index.py and commit."; exit 1; }
