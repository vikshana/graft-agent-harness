name: docs

on:
  pull_request:
    paths: ['docs/**', 'deployment/**', 'scripts/**', 'AGENTS.md', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'deployment/**', 'scripts/**', 'AGENTS.md', '.github/workflows/docs.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (Node 24)
        with:
          python-version: '3.12'

      - name: Documentation hygiene
        run: python3 scripts/check_docs.py

      - name: Decision index is up to date
        run: |
          python3 scripts/gen_adr_index.py
          git diff --exit-code docs/adr/DECISION-INDEX.md \
            || { echo "::error::DECISION-INDEX.md is stale. Run scripts/gen_adr_index.py and commit."; exit 1; }
