name: Gate 0.3 container recovery matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "deployment/gate-0.3/**"
      - "tests/gate_0_3/**"
      - ".github/workflows/gate-0-3.yml"

jobs:
  recovery-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.8.17"
      - name: Run container recovery matrix
        run: |
          uv run python deployment/gate-0.3/recovery_race.py run
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/gate-0.3/recovery-race.json"))["verdict"])')" = PASS
      - name: Run async and MCP report in isolated compose lifecycle
        run: |
          uv run python deployment/gate-0.3/run_experiment.py prepare
          docker compose --env-file deployment/gate-0.3/.env -f deployment/gate-0.3/docker-compose.yml up -d --wait app-postgres system-postgres pgbouncer
          uv run python deployment/gate-0.3/run_experiment.py run
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/gate-0.3/result.json"))["result"])')" != blocked
          docker compose --env-file deployment/gate-0.3/.env -f deployment/gate-0.3/docker-compose.yml down -v --remove-orphans
      - name: Run executor-listing report from current source
        run: |
          uv run python deployment/gate-0.3/run_experiment.py prepare
          docker compose --env-file deployment/gate-0.3/.env -f deployment/gate-0.3/docker-compose.yml up -d --wait app-postgres system-postgres pgbouncer
          uv run python deployment/gate-0.3/run_experiment.py run
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/gate-0.3/result.json"))["G03-C"]["matching_count"])')" -gt 0
          docker compose --env-file deployment/gate-0.3/.env -f deployment/gate-0.3/docker-compose.yml down -v --remove-orphans
      - name: Run Test 2 and Test 3 reports
        run: |
          uv run python deployment/gate-0.3/matrix_runner.py all
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/gate-0.3/test-2-result.json"))["verdict"])')" = PASS
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/gate-0.3/test-3-result.json"))["verdict"])')" = REDUCED_FIDELITY
      - name: Run decisive DBOS version comparison
        run: uv run python deployment/gate-0.3/version_comparison.py run
      - name: Run Gate 0.3 configuration tests
        run: uv run pytest -m gate_0_3 tests/gate_0_3/test_gate_0_3_config.py
      - name: Run relevant quality checks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "unit or contract"
          uv run python scripts/check_step_pointer_rule.py harness
          uv run python scripts/check_architecture.py harness
          uv run python scripts/check_docs.py
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: gate-0-3-evidence
          path: specs/phase-1-walking-skeleton/evidence/gate-0.3/
          if-no-files-found: error
