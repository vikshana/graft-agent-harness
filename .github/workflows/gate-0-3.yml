name: Gate 0.3 container recovery matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "deployment/gate-0.3/**"
      - "tests/gate_0_3/**"
      - ".github/workflows/gate-0-3.yml"

jobs:
  recovery-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install exact Gate 0.3 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.0"
      - name: Verify Gate 0.3 Python
        run: test "$(python -c 'import platform; print(platform.python_version())')" = "3.13.0"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.8.17"
      - name: Start accepted-scope PostgreSQL and PgBouncer topology
        run: |
          uv run --locked --python 3.13.0 python deployment/gate-0.3/run_experiment.py prepare
          docker compose --env-file deployment/gate-0.3/.env -f deployment/gate-0.3/docker-compose.yml up -d --wait app-postgres system-postgres pgbouncer
      - name: Run accepted-scope DBOS reports
        run: |
          uv run --locked --python 3.13.0 python deployment/gate-0.3/accepted_scope_reports.py all
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/dbos/01-async-mcp.json"))["verdict"])')" = PASS
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/dbos/02-alive-silent.json"))["verdict"])')" = PASS
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/dbos/03-listing.json"))["verdict"])')" = PASS
          test "$(python -c 'import json; print(json.load(open("specs/phase-1-walking-skeleton/evidence/dbos/04-versioning.json"))["verdict"])')" = PASS
      - name: Tear down accepted-scope topology
        if: always()
        run: docker compose --env-file deployment/gate-0.3/.env -f deployment/gate-0.3/docker-compose.yml down -v --remove-orphans
      - name: Run Gate 0.3 configuration tests
        run: uv run --locked --python 3.13.0 pytest tests/gate_0_3
      - name: Run relevant quality checks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -m "unit or contract"
          uv run python scripts/check_step_pointer_rule.py harness
          uv run python scripts/check_architecture.py harness
          uv run python scripts/check_docs.py
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: gate-0-3-evidence
          path: |
            specs/phase-1-walking-skeleton/evidence/dbos/
            specs/phase-1-walking-skeleton/evidence/gate-0.3/
          if-no-files-found: error
          retention-days: 14
