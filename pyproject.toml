[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graft-agent-harness"
version = "0.1.0"
description = "API-first Phase 1 harness contract and provider core"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbos>=3.0,<4",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "mcp==1.28.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pip-audit>=2,<3",
    "pip-licenses>=5,<6",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["harness", "scripts", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = [
    "unit: fast in-process unit tests",
    "contract: transport and machine-readable contract tests",
    "gate_0_3: Gate 0.3 DBOS integration experiments requiring containers",
]
filterwarnings = ["error"]
